kind: Added
body: 'Het organisatiefilter in `GET /v1/repositories/filters` is nu een `search-select` met `showTop: 10`: de frontend toont de 10 organisaties met de meeste repositories, met een zoekveld voor de rest. De OAS beschrijft het type `search-select` en `showTop` (ADR-score blijft 100).'
